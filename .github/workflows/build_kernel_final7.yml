name: Edge 50 Fusion final 7 - KernelSU Next do zero

on:
  push:
    branches: [build-final7-from-source]
    paths:
      - '.github/workflows/build_kernel_final7.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge50-final7-from-source
  cancel-in-progress: false

env:
  TARGET_BUILD: W1UUS36H.21-14-4-1-7
  STOCK_SHA256: 83752024f78bb239ca979c01550ff51b6fefa4d0200ae35d08c72d8998f2f5d5
  KSU_COMMIT: 4c706b5938665866ebe16944a481a7b91e3396af

jobs:
  build-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: Baixar os arquivos deste projeto
        uses: actions/checkout@v4

      - name: Validar o boot original da ROM final 7
        run: |
          set -euo pipefail
          mkdir -p output
          cat inputs/final7/boot-stock.img.gz.part* | gzip -dc > output/boot-original-final7.img
          echo "$STOCK_SHA256  output/boot-original-final7.img" | sha256sum -c -
          test "$(stat -c %s output/boot-original-final7.img)" = 100663296
          python3 - <<'PY'
          import pathlib, struct
          p = pathlib.Path('output/boot-original-final7.img').read_bytes()
          assert p[:8] == b'ANDROID!'
          assert struct.unpack_from('<I', p, 40)[0] == 4
          PY

      - name: Preparar ambiente limpo para compilacao
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/swift
          sudo apt-get update
          sudo apt-get install -y repo ccache bison flex bc rsync libssl-dev libelf-dev python3 lz4 pigz
          df -h .

      - name: Baixar os fontes GKI Android 12 / Linux 5.10
        run: |
          set -euo pipefail
          mkdir android-kernel
          cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10 --depth=1
          repo sync -c -j4 --no-tags --no-clone-bundle
          repo manifest -r > ../output/build-manifest.xml
          git -C common rev-parse HEAD > ../output/aosp-kernel-commit.txt

      - name: Integrar KernelSU Next estavel v3.4.2 nos fontes
        run: |
          set -euo pipefail
          cd android-kernel/common
          git clone --depth=1 --branch v3.4.2 https://github.com/KernelSU-Next/KernelSU-Next.git
          test "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSU_COMMIT"
          ln -s ../KernelSU-Next/kernel drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          touch .scmversion

      - name: Configurar swap para a compilacao
        run: |
          set -euo pipefail
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Compilar o kernel inteiro do zero com KernelSU Built-in
        run: |
          set -euo pipefail
          cd android-kernel
          BUILD_CONFIG=common/build.config.gki.aarch64 LOCALVERSION=-tecnico-root-v1 ./build/build.sh 2>&1 | tee ../output/build.log

      - name: Validar configuracao e reempacotar o boot novo
        run: |
          set -euo pipefail
          CONFIG_FILE=$(find android-kernel/out -path '*/common/.config' -type f -print -quit)
          test -n "$CONFIG_FILE"
          grep -qx 'CONFIG_KSU=y' "$CONFIG_FILE"
          grep -qx '# CONFIG_KSU_DEBUG is not set' "$CONFIG_FILE"
          cp "$CONFIG_FILE" output/kernel.config
          COMPILED_IMAGE=$(find android-kernel/out -path '*/common/arch/arm64/boot/Image' -type f -print -quit)
          test -n "$COMPILED_IMAGE"
          test -s "$COMPILED_IMAGE"
          cp "$COMPILED_IMAGE" output/Image
          mkdir work
          cd work
          curl --fail --location --retry 3 -o magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v26.1/Magisk-v26.1.apk
          unzip -p magisk.apk lib/x86_64/libmagiskboot.so > magiskboot
          chmod +x magiskboot
          ./magiskboot unpack ../output/boot-original-final7.img
          # magiskboot preserva a compressao original durante o repack.
          cp ../output/Image kernel
          ./magiskboot repack ../output/boot-original-final7.img ../output/boot-Edge50Fusion-final7-KSU-Next-v3.4.2-FROM-SOURCE.img
          mkdir verify
          cd verify
          ../magiskboot unpack ../../output/boot-Edge50Fusion-final7-KSU-Next-v3.4.2-FROM-SOURCE.img
          cmp kernel ../../output/Image
          cmp ramdisk.cpio ../ramdisk.cpio
          cd ../..
          python3 - <<'PY'
          import pathlib, struct, hashlib, os
          root = pathlib.Path('output')
          stock = (root / 'boot-original-final7.img').read_bytes()
          patched = (root / 'boot-Edge50Fusion-final7-KSU-Next-v3.4.2-FROM-SOURCE.img').read_bytes()
          assert len(stock) == len(patched) == 100663296
          assert stock[:8] == patched[:8] and stock[12:4096] == patched[12:4096]
          def ramdisk(b):
              ks, rs = struct.unpack_from('<II', b, 8)
              start = 4096 + ((ks + 4095) // 4096) * 4096
              return b[start:start + rs]
          assert ramdisk(stock) == ramdisk(patched)
          import re
          banners = re.findall(rb'Linux version [^\x00\n]+', (root / 'Image').read_bytes())
          banner = next(b.decode(errors='replace') for b in banners if b.startswith(b'Linux version 5.10.'))
          assert '-tecnico-root-v1' in banner
          (root / 'BUILD-INFO.txt').write_text('\n'.join([
              'Compilacao nova do kernel inteiro no GitHub Actions; sem reutilizar kernel de artefato anterior.',
              'Dispositivo: Motorola Edge 50 Fusion (CUSCO)',
              'ROM de destino informada pelo usuario: ' + os.environ['TARGET_BUILD'],
              'KernelSU Next: v3.4.2, Built-in; commit ' + os.environ['KSU_COMMIT'],
              banner,
              'SHA256 do kernel compilado: ' + hashlib.sha256((root / 'Image').read_bytes()).hexdigest(),
              'Workflow commit: ' + os.environ['GITHUB_SHA'],
              'Run: https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              'Cabecalho e ramdisk da imagem stock preservados; imagem modificada sem assinatura original valida do fabricante.',
              'Validacao estrutural concluida. Inicializacao, drivers e modulos ainda exigem teste no aparelho.',
              'Extraia o ZIP. Nao e modulo KernelSU. Atualize para a final 7 e confirme o boot stock antes do teste com root.',
              'O boot-original-final7.img e a copia original para recuperacao na mesma ROM.',
              'Mantenha inicialmente seu gerenciador atual. Nao aplique este boot na ROM final 6.',
          ]) + '\n')
          (root / 'Image').unlink()
          (root / 'SHA256SUMS.txt').write_text(''.join(
              hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n'
              for p in sorted(root.iterdir()) if p.is_file() and p.name != 'SHA256SUMS.txt'
          ))
          PY
          cat output/BUILD-INFO.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Entregar boot compilado e registros de verificacao
        uses: actions/upload-artifact@v4
        with:
          name: Edge50Fusion-final7-KSU-Next-v3.4.2-FROM-SOURCE
          path: output/
          if-no-files-found: error
          compression-level: 9
          retention-days: 90

      - name: Guardar log caso a compilacao falhe
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Edge50Fusion-final7-build-diagnostics
          path: |
            output/build.log
            output/build-manifest.xml
            output/aosp-kernel-commit.txt
          if-no-files-found: ignore
