name: Compilar KernelSU Next para Moto Edge 50 Fusion

on:
  workflow_dispatch:

jobs:
  build-kernelsu:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente e dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev python3-pip lz4 pigz git ccache libncurses5-dev lld clang gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi curl cpio unzip file
          pip3 install gdown

      - name: Baixar Fonte do Kernel MediaTek da Motorola (Edge 50 Fusion)
        run: |
          git clone https://github.com/MotorolaMobilityLLC/kernel-mtk.git --depth=1 android-kernel

      - name: Integrar KernelSU Next no código-fonte
        run: |
          cd android-kernel
          if [ -d "common" ]; then
              cd common
          fi
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: Configurar Swap de 12GB para estabilidade
        run: |
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Configurar Versão e Compilar o Kernel com KernelSU Next
        run: |
          cd android-kernel
          rm -rf out
          touch .scmversion

          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- defconfig || true

          if [ -f "out/.config" ]; then
              scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "-tecnico-root-v1"
              make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          fi

          export HOSTCFLAGS="-Wno-error=strict-prototypes -Wno-error=implicit-int -Wno-error=implicit-function-declaration -Wno-error=return-type"
          make -k -j$(nproc --all) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- KCFLAGS="-w" WERROR=0 Image.gz-dtb || \
          make -k -j$(nproc --all) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- KCFLAGS="-w" WERROR=0 Image.gz

      - name: Processar e Reempacotar com Boot.img Original
        run: |
          mkdir -p work
          cd work

          # 1. Baixar o boot.img oficial da versão final 7
          FILE_ID="1EmqBaLng6Cxho91VAA9oLRAlc_J9YkHz"
          gdown "https://drive.google.com/uc?id=${FILE_ID}" -O boot_stock.img
          ls -lh boot_stock.img

          # 2. Baixar APK oficial do Magisk para extrair libmagiskboot.so (x86_64)
          MAGISK_APK_URL=$(curl -s https://api.github.com/repos/topjohnwu/Magisk/releases/latest | grep "browser_download_url" | grep "\.apk" | cut -d '"' -f 4 | head -n 1)
          echo "Baixando Magisk APK: $MAGISK_APK_URL"
          curl -fSL -o magisk.apk "$MAGISK_APK_URL"
          unzip -j -o magisk.apk "lib/x86_64/libmagiskboot.so" -d .
          mv libmagiskboot.so magiskboot
          chmod +x magiskboot
          file magiskboot
          ls -lh magiskboot

          # 3. Desempacotar o boot original
          ./magiskboot unpack boot_stock.img

          # 4. Localizar a imagem compilada do kernel
          COMPILED_IMAGE=$(find ../android-kernel/out -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" | head -n 1)
          echo "Kernel compilado encontrado em: $COMPILED_IMAGE"

          cp "$COMPILED_IMAGE" kernel

          # 5. Reempacotar o boot.img final com o KernelSU Next embutido
          ./magiskboot repack boot_stock.img boot_finished.img
          cp boot_finished.img ../boot_finished.img
          ls -lh ../boot_finished.img
          cd ..

      - name: Enviar Artefato (boot.img Final com KernelSU Next)
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU_Next_Edge50Fusion_tecnico-root-v1
          path: boot_finished.img
          
