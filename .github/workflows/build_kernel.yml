name: Build KernelSU Next do Zero para Moto Edge 50 Fusion (CUSCO)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente e repositório Android Kernel
        run: |
          sudo apt-get update
          sudo apt-get install -y repo ccache bison libssl-dev libelf-dev python3-pip lz4 pigz file unzip curl
          pip3 install gdown
          mkdir -p android-kernel
          cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10 --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle

      - name: Integrar KernelSU Next no código-fonte
        run: |
          cd android-kernel/common
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: Configurar Swap de 12GB para evitar falta de memória
        run: |
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Compilar Kernel do Zero (GKI 5.10)
        run: |
          cd android-kernel
          touch common/.scmversion
          BUILD_CONFIG=common/build.config.gki.aarch64 LOCALVERSION=-tecnico-root-v1 ./build/build.sh

      - name: Processar e Reempacotar com Magiskboot
        run: |
          mkdir -p work
          cd work

          FILE_ID="1EmqBaLng6Cxho91VAA9oLRAlc_J9YkHz"
          gdown "https://drive.google.com/uc?id=${FILE_ID}" -O boot_stock.img
          if [ ! -s "boot_stock.img" ]; then
              echo "ERRO: boot_stock.img nao foi baixado ou esta vazio."
              exit 1
          fi

          curl -L -o magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v26.1/Magisk-v26.1.apk
          unzip -q magisk.apk
          cp lib/x86_64/libmagiskboot.so ./magiskboot
          chmod +x magiskboot

          ./magiskboot unpack boot_stock.img

          COMPILED_IMAGE=$(find ../android-kernel/out -name "Image" -type f | head -n 1)
          echo "Kernel compilado encontrado em: $COMPILED_IMAGE"
          if [ -z "$COMPILED_IMAGE" ] || [ ! -s "$COMPILED_IMAGE" ]; then
              echo "ERRO: Imagem compilada nao encontrada."
              exit 1
          fi

          KERNEL_FMT=$(file kernel | grep -o -E 'LZ4|gzip|raw' || echo "raw")
          echo "Formato detectado do kernel original: $KERNEL_FMT"

          if [[ "$KERNEL_FMT" == *"LZ4"* ]]; then
             lz4 -c -12 "$COMPILED_IMAGE" > kernel
          elif [[ "$KERNEL_FMT" == *"gzip"* ]]; then
             gzip -c -9 "$COMPILED_IMAGE" > kernel
          else
             cp "$COMPILED_IMAGE" kernel
          fi

          ./magiskboot repack boot_stock.img boot_finished.img
          if [ ! -s "boot_finished.img" ]; then
              echo "ERRO: boot_finished.img nao foi gerado."
              exit 1
          fi
          cp boot_finished.img ../boot_finished.img

      - name: Anexar Artefato (boot.img Final Compilado)
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU_Next_Moto_Edge_50_Fusion_Compiled
          path: boot_finished.img
          
